# TRM Nirvana v3.0 - Render Free Tier Deployment Config

services:
  # Main web service - Streamlit App
  - type: web
    name: trm-nirvana
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    healthCheckPath: /
    healthCheckTimeout: 100
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8501
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
